# http-level settings shared by the two sites (conf.d; Debian nginx.conf already has `gzip on`). Static text types only: the admin API and
# any response that carries a session or token is not compressed (BREACH).
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css application/javascript text/javascript image/svg+xml;

# Anything that is not one of our hostnames (server IP, other domains, scanners) gets nothing.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}
