    <title>融合升级 新型工业化提速</title>
    <link rel="canonical" href="https://www.gov.cn/yaowen/liebiao/202608/content_7079251.htm">
  </head>
  <body>
    <main class="pages_content">
      <p>新一代信息技术与制造业加快融合，人工智能、机器人和新材料等关键技术取得进展，推动新型工业化提质升级。</p>
      <p>有关部门在会议上介绍，下一阶段将计划开展更多技术验证，支持工业互联网、智能工厂和数字化转型形成可复制的应用成果。</p>
      <p>多地企业已完成智能生产线改造，关键环节实现技术进展，科技创新正在为产业体系升级提供持续动力。</p>
    </main>
