<!doctype html><html><head><title>人工智能教育应用治理办法发布</title><link rel="canonical" href="https://www.gov.cn/zhengce/content/202607/content_1001.htm"></head><body><main class="pages_content"><p>国务院有关部门发布人工智能教育应用治理办法，强调以安全、可靠、普惠的技术能力服务学校、教师、学生和家庭。</p><p>政策要求完善数字教育资源供给，加强人工智能应用规范和数据治理，持续提升教育公共服务质量。</p></main></body></html>
