    <h1>教育部部署开展义务教育阶段科学教育“做中学”领航行动</h1>
    <div class="TRS_Editor">
      教育部部署开展科学教育行动，推动学校加强科学探究实践和实验教学，服务科技发展。
      活动将结合人工智能、机器人、航空航天等内容，提升学生的创新和工程实践能力。
      各地将完善科学教育课程资源，开展科普活动和探究学习，促进科学教育高质量发展。
    </div>
