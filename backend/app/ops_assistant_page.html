<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>推送运维助手</title>
<style>
/* Layout: conversation column + sandbox draft panel; stacks to one column on phones. */
:root {
  --bg: #f2f4f1; --surface: #ffffff; --ink: #15201a; --ink-2: #536059; --line: #d9dfd9;
  --accent: #0b6b5c; --accent-ink: #ffffff; --accent-soft: #e1eeea;
  --warn: #8a5300; --warn-soft: #fbf0dc; --bad: #b42318;
  --font: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1412; --surface: #16201c; --ink: #e6ede9; --ink-2: #a3b1aa; --line: #27342e;
    --accent: #45b8a2; --accent-ink: #08201b; --accent-soft: #173029; --warn: #e3a64e; --warn-soft: #2c2312;
    --bad: #f0786a; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.65 var(--font); }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; height: 100%; padding: 16px; max-width: 1240px; margin: 0 auto; }
.chat { display: grid; grid-template-rows: auto 1fr auto; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.bar h1 { font-size: 16px; margin: 0; flex: 1; }
.bar small { color: var(--ink-2); }
button { font: inherit; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 12px; cursor: pointer; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:disabled { opacity: 0.55; cursor: progress; }
.log { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.msg { max-width: 760px; display: grid; gap: 6px; }
.msg.user { align-self: flex-end; background: var(--accent-soft); padding: 8px 12px; border-radius: 10px 10px 2px 10px; }
.msg.bot .text { white-space: pre-wrap; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; }
.step { font: 12px/1.6 var(--mono); padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink-2); }
.step.err { color: var(--bad); border-color: var(--bad); }
.step.approved { color: var(--accent); border-color: var(--accent); }
.meta { font-size: 12px; color: var(--ink-2); }
.approval { border: 1px solid var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 12px; display: grid; gap: 8px; }
.approval b { color: var(--warn); }
.diff { display: grid; gap: 4px; font-size: 13.5px; }
.diff .before { text-decoration: line-through; color: var(--ink-2); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.compose { border-top: 1px solid var(--line); padding: 12px; display: grid; gap: 8px; }
.compose form { display: flex; gap: 8px; }
textarea { flex: 1; min-width: 0; resize: none; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; height: 44px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; color: var(--ink-2); }
aside { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; overflow-y: auto; min-height: 0; display: grid; gap: 12px; align-content: start; }
aside h2 { font-size: 14px; margin: 0; }
aside .empty { color: var(--ink-2); font-size: 13px; }
.hook { background: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; }
.claims { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; }
.claims .kind { font: 11.5px var(--mono); color: var(--ink-2); }
.note { font-size: 12px; color: var(--ink-2); }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; height: auto; } .chat { min-height: 70vh; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <section class="chat" aria-label="对话">
    <div class="bar"><h1>推送运维助手</h1><small>只读查询 · 改稿需确认 · 不写线上</small><small id="thread" title="对话编号：用 --thread 重启后可继续"></small><button id="reset" type="button">新对话</button></div>
    <div class="log" id="log" aria-live="polite">
      <div class="msg bot"><div class="text">可以问我某天各时段推送的情况、哪条文案被拦以及原因、耗时和 token 用量；也可以让我打开一条文案，在沙盒里帮你改，每次修改都会先给你确认。</div></div>
    </div>
    <div class="compose">
      <div class="chips" id="chips">
        <button type="button">今天中午的推送都发出去了吗？</button>
        <button type="button">昨天有没有被拦下的文案？为什么？</button>
        <button type="button">昨天每个环节花了多少 token，哪一步最慢？</button>
      </div>
      <form id="form"><textarea id="input" placeholder="问点什么，Enter 发送，Shift+Enter 换行" aria-label="消息"></textarea><button class="primary" id="send" type="submit">发送</button></form>
    </div>
  </section>
  <aside aria-label="沙盒草稿">
    <h2>沙盒草稿</h2>
    <div id="draft"><p class="empty">还没有打开草稿。让助手“打开某条文案”后，这里会显示沙盒里的副本和修改记录。</p></div>
  </aside>
</div>
<script>
(() => {
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const draftBox = document.getElementById("draft");
  let busy = false;

  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const scroll = () => { log.scrollTop = log.scrollHeight; };
  const setBusy = (value) => { busy = value; send.disabled = value; send.textContent = value ? "处理中…" : "发送"; };

  async function post(path, body) {
    const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || ("请求失败 " + response.status));
    return data;
  }

  function renderDraft(draft) {
    if (!draft) return;
    draftBox.replaceChildren();
    draftBox.append(el("div", "note", "任务 " + draft.run_id.slice(0, 8) + (draft.edits.length ? " · 已改 " + draft.edits.length + " 处" : " · 未修改")));
    draftBox.append(el("div", "hook", draft.view.hook || "（无引导语）"));
    const list = el("ol", "claims");
    for (const claim of draft.view.claims) {
      const li = el("li");
      li.append(el("div", "kind", claim.id + " · " + claim.kind));
      li.append(el("div", null, claim.text));
      list.append(li);
    }
    draftBox.append(list);
    if (draft.edits.length) {
      const copy = el("button", null, "复制修改后的朋友圈文案");
      copy.type = "button";
      copy.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(draft.copywriting); copy.textContent = "已复制"; }
        catch { copy.textContent = "复制失败，请手动选择"; }
      });
      draftBox.append(copy);
      draftBox.append(el("p", "note", "修改只在沙盒里。请到审核页提交，线上内容不会被自动改动。"));
    }
  }

  function renderReply(reply) {
    const box = el("div", "msg bot");
    if (reply.steps && reply.steps.length) {
      const steps = el("div", "steps");
      for (const step of reply.steps) {
        const cls = "step" + (step.ok ? "" : " err") + (step.approval === "approved" ? " approved" : "");
        const label = step.tool + (step.approval !== "auto" ? " · " + (step.approval === "approved" ? "已确认" : "已拒绝") : "") + (step.ok ? "" : " · " + step.error_code);
        steps.append(el("span", cls, label));
      }
      box.append(steps);
    }
    if (reply.kind === "approval" && reply.approval) {
      const card = el("div", "approval");
      const names = { rewrite_hook: "改引导语", replace_claim: "替换一条素材", drop_claim: "删除一条素材" };
      card.append(el("b", null, "需要你确认：" + (names[reply.approval.tool] || reply.approval.tool)));
      const diff = el("div", "diff");
      const preview = reply.approval.preview || {};
      if (preview.claim_id) diff.append(el("div", "meta", preview.claim_id));
      diff.append(el("div", "before", preview.before || ""));
      diff.append(el("div", null, preview.after == null ? "（删除）" : preview.after));
      card.append(diff);
      const actions = el("div", "actions");
      const yes = el("button", "primary", "确认执行"); yes.type = "button";
      const no = el("button", null, "拒绝"); no.type = "button";
      const decide = async (approve) => {
        if (busy) return; setBusy(true); yes.disabled = no.disabled = true;
        card.append(el("div", "meta", approve ? "已确认，继续处理…" : "已拒绝，继续处理…"));
        try { renderReply(await post("/api/decision", { approve })); }
        catch (error) { box.append(el("div", "meta", error.message)); }
        finally { setBusy(false); }
      };
      yes.addEventListener("click", () => decide(true));
      no.addEventListener("click", () => decide(false));
      actions.append(yes, no);
      card.append(actions);
      box.append(card);
    } else {
      box.append(el("div", "text", reply.text || ""));
      box.append(el("div", "meta", "输入 " + reply.prompt_tokens + " · 输出 " + reply.completion_tokens + " token"));
    }
    log.append(box);
    renderDraft(reply.draft);
    scroll();
  }

  async function ask(text) {
    if (busy || !text.trim()) return;
    log.append(el("div", "msg user", text)); scroll();
    input.value = ""; setBusy(true);
    try { renderReply(await post("/api/message", { text })); }
    catch (error) { log.append(el("div", "msg bot meta", error.message)); }
    finally { setBusy(false); input.focus(); }
  }

  document.getElementById("form").addEventListener("submit", (event) => { event.preventDefault(); ask(input.value); });
  input.addEventListener("keydown", (event) => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); ask(input.value); } });
  document.getElementById("chips").addEventListener("click", (event) => { if (event.target.tagName === "BUTTON") ask(event.target.textContent); });
  const threadLabel = document.getElementById("thread");
  const showThread = (id) => { threadLabel.textContent = id ? "对话 " + id.slice(-8) : ""; threadLabel.title = id || ""; };

  document.getElementById("reset").addEventListener("click", async () => {
    if (busy) return;
    const state = await post("/api/reset", {});
    showThread(state.thread_id);
    log.replaceChildren(log.firstElementChild);
    draftBox.replaceChildren(el("p", "empty", "还没有打开草稿。"));
  });

  // After a restart with --thread (and a database checkpointer) the waiting approval is restored.
  fetch("/api/state").then((response) => response.json()).then((state) => {
    showThread(state.thread_id);
    if (state.pending) {
      log.append(el("div", "msg bot meta", "继续上次的对话：有一个修改在等你确认。"));
      renderReply({ kind: "approval", approval: state.pending, steps: [] });
    }
  }).catch(() => {});
})();
</script>
</body>
</html>
