name: edu-ai-lead-agent

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edu_ai}
      POSTGRES_USER: ${POSTGRES_USER:-edu_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edu_ai_local_change_me}
      TZ: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edu_ai_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-edu_ai_minio_local_change_me}
      TZ: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edu_ai_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-edu_ai_minio_local_change_me}
      MINIO_BUCKET: ${MINIO_BUCKET:-edu-ai-materials}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        /usr/bin/mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        /usr/bin/mc anonymous set none "local/$${MINIO_BUCKET}"

  backend-migrate:
    build:
      context: ./backend
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment: &backend-environment
      APP_ENV: ${APP_ENV:-development}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-edu_ai}:${POSTGRES_PASSWORD:-edu_ai_local_change_me}@postgres:5432/${POSTGRES_DB:-edu_ai}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-edu-ai-materials}
      MINIO_SECURE: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-edu_ai_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-edu_ai_minio_local_change_me}
      ACQUISITION_SCHEDULE_HOUR: ${ACQUISITION_SCHEDULE_HOUR:-6}
      ACQUISITION_SCHEDULE_MINUTE: ${ACQUISITION_SCHEDULE_MINUTE:-30}
      ACQUISITION_CATCHUP_HOURS: ${ACQUISITION_CATCHUP_HOURS:-12}
      ACQUISITION_POLL_SECONDS: ${ACQUISITION_POLL_SECONDS:-2}
      ACQUISITION_WORKER_CONCURRENCY: ${ACQUISITION_WORKER_CONCURRENCY:-4}
      ACQUISITION_LEASE_SECONDS: ${ACQUISITION_LEASE_SECONDS:-120}
      ACQUISITION_HEARTBEAT_SECONDS: ${ACQUISITION_HEARTBEAT_SECONDS:-30}
      ACQUISITION_MAX_ATTEMPTS: ${ACQUISITION_MAX_ATTEMPTS:-3}
      ACQUISITION_MAX_RESPONSE_BYTES: ${ACQUISITION_MAX_RESPONSE_BYTES:-5242880}
      ACQUISITION_CONNECT_TIMEOUT_SECONDS: ${ACQUISITION_CONNECT_TIMEOUT_SECONDS:-10}
      ACQUISITION_READ_TIMEOUT_SECONDS: ${ACQUISITION_READ_TIMEOUT_SECONDS:-30}
      ACQUISITION_TOTAL_TIMEOUT_SECONDS: ${ACQUISITION_TOTAL_TIMEOUT_SECONDS:-45}
      ACQUISITION_MAX_REDIRECTS: ${ACQUISITION_MAX_REDIRECTS:-3}
      ACQUISITION_USER_AGENT: ${ACQUISITION_USER_AGENT:-EduAILeadAgent/0.1 (+https://github.com/EDLlyc/edu-ai-lead-agent)}
      ACQUISITION_FIRST_RUN_ITEM_LIMIT: ${ACQUISITION_FIRST_RUN_ITEM_LIMIT:-20}
      ACQUISITION_DAILY_ITEM_LIMIT: ${ACQUISITION_DAILY_ITEM_LIMIT:-10}
      ACQUISITION_FIRST_RUN_SCAN_LIMIT: ${ACQUISITION_FIRST_RUN_SCAN_LIMIT:-100}
      ACQUISITION_DAILY_SCAN_LIMIT: ${ACQUISITION_DAILY_SCAN_LIMIT:-50}
      ACQUISITION_VERSION: ${ACQUISITION_VERSION:-acquisition-v5-tiered-science-tech}
      ACQUISITION_FRESHNESS_WINDOW_DAYS: ${ACQUISITION_FRESHNESS_WINDOW_DAYS:-10}
      ACQUISITION_MAX_RETRY_AFTER_SECONDS: ${ACQUISITION_MAX_RETRY_AFTER_SECONDS:-300}
      GOVERNANCE_ENABLED: ${GOVERNANCE_ENABLED:-false}
      GOVERNANCE_POLL_SECONDS: ${GOVERNANCE_POLL_SECONDS:-5}
      GOVERNANCE_WORKER_CONCURRENCY: ${GOVERNANCE_WORKER_CONCURRENCY:-2}
      GOVERNANCE_LEASE_SECONDS: ${GOVERNANCE_LEASE_SECONDS:-300}
      GOVERNANCE_HEARTBEAT_SECONDS: ${GOVERNANCE_HEARTBEAT_SECONDS:-60}
      GOVERNANCE_MAX_ATTEMPTS: ${GOVERNANCE_MAX_ATTEMPTS:-3}
      GOVERNANCE_RETRY_BASE_SECONDS: ${GOVERNANCE_RETRY_BASE_SECONDS:-30}
      GOVERNANCE_PIPELINE_VERSION: ${GOVERNANCE_PIPELINE_VERSION:-governance-v1}
      GOVERNANCE_NORMALIZATION_VERSION: ${GOVERNANCE_NORMALIZATION_VERSION:-normalization-v1}
      GOVERNANCE_PASSAGE_SCHEMA_VERSION: ${GOVERNANCE_PASSAGE_SCHEMA_VERSION:-passage-v1}
      GOVERNANCE_TAXONOMY_VERSION: ${GOVERNANCE_TAXONOMY_VERSION:-ai-factual-taxonomy-v1}
      GOVERNANCE_PROMPT_VERSION: ${GOVERNANCE_PROMPT_VERSION:-factual-analysis-v1}
      GOVERNANCE_ANALYSIS_SCHEMA_VERSION: ${GOVERNANCE_ANALYSIS_SCHEMA_VERSION:-factual-analysis-schema-v1}
      GOVERNANCE_EMBEDDING_INPUT_VERSION: ${GOVERNANCE_EMBEDDING_INPUT_VERSION:-embedding-input-v1}
      GOVERNANCE_SIMILARITY_RULE_VERSION: ${GOVERNANCE_SIMILARITY_RULE_VERSION:-semantic-v1}
      GOVERNANCE_EVENT_ASSIGNMENT_VERSION: ${GOVERNANCE_EVENT_ASSIGNMENT_VERSION:-event-assignment-v1}
      GOVERNANCE_CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-edu_ai}:${POSTGRES_PASSWORD:-edu_ai_local_change_me}@postgres:5432/${POSTGRES_DB:-edu_ai}
      CONTENT_ENABLED: ${CONTENT_ENABLED:-false}
      CONTENT_SCHEDULE_HOUR: ${CONTENT_SCHEDULE_HOUR:-7}
      CONTENT_SCHEDULE_MINUTE: ${CONTENT_SCHEDULE_MINUTE:-30}
      CONTENT_CATCHUP_HOURS: ${CONTENT_CATCHUP_HOURS:-12}
      CONTENT_POLL_SECONDS: ${CONTENT_POLL_SECONDS:-2}
      CONTENT_WORKER_CONCURRENCY: ${CONTENT_WORKER_CONCURRENCY:-1}
      CONTENT_LEASE_SECONDS: ${CONTENT_LEASE_SECONDS:-120}
      CONTENT_HEARTBEAT_SECONDS: ${CONTENT_HEARTBEAT_SECONDS:-30}
      CONTENT_MAX_ATTEMPTS: ${CONTENT_MAX_ATTEMPTS:-3}
      CONTENT_FRESHNESS_WINDOW_DAYS: ${CONTENT_FRESHNESS_WINDOW_DAYS:-10}
      CONTENT_SCORING_VERSION: ${CONTENT_SCORING_VERSION:-scoring-v1-preview.6-tiered-science-tech-priority}
      CONTENT_SCORING_PROFILE: ${CONTENT_SCORING_PROFILE:-preview}
      CONTENT_SELECTION_PRIORITY_RULE_VERSION: ${CONTENT_SELECTION_PRIORITY_RULE_VERSION:-ministry-education-priority-v3}
      BRAND_UPLOAD_MAX_BYTES: ${BRAND_UPLOAD_MAX_BYTES:-26214400}
      BRAND_PARSE_MAX_PAGES: ${BRAND_PARSE_MAX_PAGES:-120}
      BRAND_PARSE_MAX_CHARACTERS: ${BRAND_PARSE_MAX_CHARACTERS:-300000}
      BRAND_PARSE_MAX_CHUNKS: ${BRAND_PARSE_MAX_CHUNKS:-600}
      BRAND_CHUNK_CHARACTERS: ${BRAND_CHUNK_CHARACTERS:-900}
      BRAND_CHUNK_OVERLAP_CHARACTERS: ${BRAND_CHUNK_OVERLAP_CHARACTERS:-120}
      BRAND_PARSER_VERSION: ${BRAND_PARSER_VERSION:-brand-parser-v2-glm-ocr}
      BRAND_CHUNK_VERSION: ${BRAND_CHUNK_VERSION:-brand-chunk-v2-structure-aware}
      BRAND_EMBEDDING_INPUT_VERSION: ${BRAND_EMBEDDING_INPUT_VERSION:-brand-embedding-input-v1}
      BRAND_RETRIEVAL_VERSION: ${BRAND_RETRIEVAL_VERSION:-brand-hybrid-rrf-v2-diverse}
      BRAND_OCR_MODEL: ${BRAND_OCR_MODEL:-glm-ocr}
      BRAND_OCR_SPARSE_TEXT_THRESHOLD: ${BRAND_OCR_SPARSE_TEXT_THRESHOLD:-40}
      BRAND_OCR_MAX_REQUEST_BYTES: ${BRAND_OCR_MAX_REQUEST_BYTES:-41943040}
      BRAND_OCR_MAX_RESPONSE_BYTES: ${BRAND_OCR_MAX_RESPONSE_BYTES:-10485760}
      BRAND_OCR_TIMEOUT_SECONDS: ${BRAND_OCR_TIMEOUT_SECONDS:-180}
      BRAND_OCR_MAX_PAGES: ${BRAND_OCR_MAX_PAGES:-100}
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-disabled}
      AI_PLATFORM_BASE_URL: ${AI_PLATFORM_BASE_URL:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-glm-5.2}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-embedding-3}
      AI_EMBEDDING_DIMENSIONS: ${AI_EMBEDDING_DIMENSIONS:-2048}
      AI_CONNECT_TIMEOUT_SECONDS: ${AI_CONNECT_TIMEOUT_SECONDS:-10}
      AI_READ_TIMEOUT_SECONDS: ${AI_READ_TIMEOUT_SECONDS:-120}
      AI_TOTAL_TIMEOUT_SECONDS: ${AI_TOTAL_TIMEOUT_SECONDS:-150}
      AI_PROVIDER_CONCURRENCY: ${AI_PROVIDER_CONCURRENCY:-2}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-3}
      AI_MAX_VALIDATION_CORRECTIONS: ${AI_MAX_VALIDATION_CORRECTIONS:-1}
      AI_MAX_INPUT_CHARACTERS: ${AI_MAX_INPUT_CHARACTERS:-40000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-4096}
      AI_MAX_TOKENS_PER_RUN: ${AI_MAX_TOKENS_PER_RUN:-200000}
      AI_MAX_TOKENS_PER_DAY: ${AI_MAX_TOKENS_PER_DAY:-1000000}
      AI_MAX_COST_UNITS_PER_RUN: ${AI_MAX_COST_UNITS_PER_RUN:-100000}
      AI_MAX_COST_UNITS_PER_DAY: ${AI_MAX_COST_UNITS_PER_DAY:-500000}
    command:
      - /bin/sh
      - -c
      - alembic -c alembic.ini upgrade head && python -m app.seed_sources

  acquisition-api:
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      - ./private/brand-materials:/app/private/brand-materials:ro
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
      AI_PLATFORM_API_KEY: ${AI_PLATFORM_API_KEY:-}
      IMAGE_ENABLED: ${IMAGE_ENABLED:-false}
      IMAGE_PROVIDER_MODE: ${IMAGE_PROVIDER_MODE:-disabled}
      TOAPIS_BASE_URL: ${TOAPIS_BASE_URL:-https://toapis.com}
      TOAPIS_API_KEY: ${TOAPIS_API_KEY:-}
      COMFLY_BASE_URL: ${COMFLY_BASE_URL:-https://ai.comfly.org}
      COMFLY_API_KEY: ${COMFLY_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
      IMAGE_PROMPT_VERSION: ${IMAGE_PROMPT_VERSION:-image-prompt-v1}
      IMAGE_PIPELINE_VERSION: ${IMAGE_PIPELINE_VERSION:-image-pipeline-v1}
      IMAGE_MAX_ATTEMPTS: ${IMAGE_MAX_ATTEMPTS:-3}
      IMAGE_MAX_REQUEST_BYTES: ${IMAGE_MAX_REQUEST_BYTES:-16777216}
      IMAGE_MAX_PROVIDER_RESPONSE_BYTES: ${IMAGE_MAX_PROVIDER_RESPONSE_BYTES:-33554432}
      IMAGE_MAX_REFERENCE_IMAGES: ${IMAGE_MAX_REFERENCE_IMAGES:-3}
      IMAGE_REFERENCE_BUDGET_BYTES: ${IMAGE_REFERENCE_BUDGET_BYTES:-6291456}
      IMAGE_ASSET_MANIFEST: ${IMAGE_ASSET_MANIFEST:-private/brand-materials/visual-assets.manifest.json}
      IMAGE_SELECTOR_VERSION: ${IMAGE_SELECTOR_VERSION:-brand-visual-selector-v1}
      IMAGE_SELECTOR_ENABLED: ${IMAGE_SELECTOR_ENABLED:-true}
      IMAGE_OCR_ENABLED: ${IMAGE_OCR_ENABLED:-false}
      IMAGE_QUALITY_AUDIT_ENABLED: ${IMAGE_QUALITY_AUDIT_ENABLED:-false}
      WECOM_ENABLED: ${WECOM_ENABLED:-false}
      WECOM_API_BASE_URL: ${WECOM_API_BASE_URL:-https://qyapi.weixin.qq.com}
      WECOM_DELIVERY_PROVIDER: ${WECOM_DELIVERY_PROVIDER:-self_built_app}
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_CORP_SECRET: ${WECOM_CORP_SECRET:-}
      WECOM_GROUP_WEBHOOK_KEY: ${WECOM_GROUP_WEBHOOK_KEY:-}
      WECOM_DEFAULT_RECIPIENT_ID: ${WECOM_DEFAULT_RECIPIENT_ID:-}
      WECOM_DEFAULT_RECIPIENT_NAME: ${WECOM_DEFAULT_RECIPIENT_NAME:-销售}
      WECOM_AUTO_DELIVERY_ENABLED: ${WECOM_AUTO_DELIVERY_ENABLED:-false}
      WECOM_REQUIRE_REVIEW_BEFORE_SEND: ${WECOM_REQUIRE_REVIEW_BEFORE_SEND:-true}
      WECOM_POLL_SECONDS: ${WECOM_POLL_SECONDS:-2}
      WECOM_WORKER_CONCURRENCY: ${WECOM_WORKER_CONCURRENCY:-1}
      WECOM_LEASE_SECONDS: ${WECOM_LEASE_SECONDS:-120}
      WECOM_HEARTBEAT_SECONDS: ${WECOM_HEARTBEAT_SECONDS:-30}
      WECOM_MAX_ATTEMPTS: ${WECOM_MAX_ATTEMPTS:-3}
      WECOM_REQUEST_TIMEOUT_SECONDS: ${WECOM_REQUEST_TIMEOUT_SECONDS:-15}
      WECOM_MAX_IMAGE_BYTES: ${WECOM_MAX_IMAGE_BYTES:-10485760}
      WECOM_MAX_TEXT_BYTES: ${WECOM_MAX_TEXT_BYTES:-2048}
      WECOM_GROUP_MAX_IMAGE_BYTES: ${WECOM_GROUP_MAX_IMAGE_BYTES:-2097152}
      WECOM_GROUP_MAX_TEXT_BYTES: ${WECOM_GROUP_MAX_TEXT_BYTES:-4096}
    command: ["python", "-m", "uvicorn", "app.api_main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  acquisition-scheduler:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
    command: ["python", "-m", "app.scheduler_main"]

  acquisition-worker:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
    command: ["python", "-m", "app.worker_main"]

  governance-scheduler:
    profiles: ["governance"]
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
      GOVERNANCE_SCHEDULER_ENABLED: ${GOVERNANCE_SCHEDULER_ENABLED:-false}
    command: ["python", "-m", "app.governance_scheduler_main"]

  governance-worker:
    profiles: ["governance"]
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
      GOVERNANCE_WORKER_ENABLED: ${GOVERNANCE_WORKER_ENABLED:-false}
      AI_PLATFORM_API_KEY: ${AI_PLATFORM_API_KEY:-}
    command: ["python", "-m", "app.governance_worker_main"]

  content-scheduler:
    profiles: ["content"]
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
      CONTENT_SCHEDULER_ENABLED: ${CONTENT_SCHEDULER_ENABLED:-false}
    command: ["python", "-m", "app.content_scheduler_main"]

  content-worker:
    profiles: ["content"]
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      - ./private/brand-materials:/app/private/brand-materials:ro
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
      CONTENT_WORKER_ENABLED: ${CONTENT_WORKER_ENABLED:-false}
      AI_PLATFORM_API_KEY: ${AI_PLATFORM_API_KEY:-}
      IMAGE_ENABLED: ${IMAGE_ENABLED:-false}
      IMAGE_PROVIDER_MODE: ${IMAGE_PROVIDER_MODE:-disabled}
      TOAPIS_BASE_URL: ${TOAPIS_BASE_URL:-https://toapis.com}
      TOAPIS_API_KEY: ${TOAPIS_API_KEY:-}
      COMFLY_BASE_URL: ${COMFLY_BASE_URL:-https://ai.comfly.org}
      COMFLY_API_KEY: ${COMFLY_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
      IMAGE_PROMPT_VERSION: ${IMAGE_PROMPT_VERSION:-image-prompt-v1}
      IMAGE_PIPELINE_VERSION: ${IMAGE_PIPELINE_VERSION:-image-pipeline-v1}
      IMAGE_MAX_ATTEMPTS: ${IMAGE_MAX_ATTEMPTS:-3}
      IMAGE_POLL_INITIAL_SECONDS: ${IMAGE_POLL_INITIAL_SECONDS:-5}
      IMAGE_POLL_INTERVAL_SECONDS: ${IMAGE_POLL_INTERVAL_SECONDS:-7}
      IMAGE_PROVIDER_TIMEOUT_SECONDS: ${IMAGE_PROVIDER_TIMEOUT_SECONDS:-300}
      IMAGE_PROVIDER_WINDOW_SECONDS: ${IMAGE_PROVIDER_WINDOW_SECONDS:-300}
      IMAGE_MAX_DOWNLOAD_BYTES: ${IMAGE_MAX_DOWNLOAD_BYTES:-20971520}
      IMAGE_MAX_REQUEST_BYTES: ${IMAGE_MAX_REQUEST_BYTES:-16777216}
      IMAGE_MAX_PROVIDER_RESPONSE_BYTES: ${IMAGE_MAX_PROVIDER_RESPONSE_BYTES:-33554432}
      IMAGE_MAX_REFERENCE_IMAGES: ${IMAGE_MAX_REFERENCE_IMAGES:-3}
      IMAGE_REFERENCE_BUDGET_BYTES: ${IMAGE_REFERENCE_BUDGET_BYTES:-6291456}
      IMAGE_ASSET_MANIFEST: ${IMAGE_ASSET_MANIFEST:-private/brand-materials/visual-assets.manifest.json}
      IMAGE_SELECTOR_VERSION: ${IMAGE_SELECTOR_VERSION:-brand-visual-selector-v1}
      IMAGE_SELECTOR_ENABLED: ${IMAGE_SELECTOR_ENABLED:-true}
      IMAGE_REFERENCE_ASSET: ${IMAGE_REFERENCE_ASSET:-private/brand-materials/05-visual-assets/赛先生-显微镜.png}
      IMAGE_OCR_ENABLED: ${IMAGE_OCR_ENABLED:-false}
      IMAGE_QUALITY_AUDIT_ENABLED: ${IMAGE_QUALITY_AUDIT_ENABLED:-false}
    command: ["python", "-m", "app.content_worker_main"]

  wecom-dispatcher:
    profiles: ["wecom"]
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      - ./private/brand-materials:/app/private/brand-materials:ro
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
    environment:
      <<: *backend-environment
      WECOM_ENABLED: ${WECOM_ENABLED:-false}
      WECOM_API_BASE_URL: ${WECOM_API_BASE_URL:-https://qyapi.weixin.qq.com}
      WECOM_DELIVERY_PROVIDER: ${WECOM_DELIVERY_PROVIDER:-self_built_app}
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_CORP_SECRET: ${WECOM_CORP_SECRET:-}
      WECOM_GROUP_WEBHOOK_KEY: ${WECOM_GROUP_WEBHOOK_KEY:-}
      WECOM_DEFAULT_RECIPIENT_ID: ${WECOM_DEFAULT_RECIPIENT_ID:-}
      WECOM_DEFAULT_RECIPIENT_NAME: ${WECOM_DEFAULT_RECIPIENT_NAME:-销售}
      WECOM_AUTO_DELIVERY_ENABLED: ${WECOM_AUTO_DELIVERY_ENABLED:-false}
      WECOM_REQUIRE_REVIEW_BEFORE_SEND: ${WECOM_REQUIRE_REVIEW_BEFORE_SEND:-true}
      WECOM_POLL_SECONDS: ${WECOM_POLL_SECONDS:-2}
      WECOM_WORKER_CONCURRENCY: ${WECOM_WORKER_CONCURRENCY:-1}
      WECOM_LEASE_SECONDS: ${WECOM_LEASE_SECONDS:-120}
      WECOM_HEARTBEAT_SECONDS: ${WECOM_HEARTBEAT_SECONDS:-30}
      WECOM_MAX_ATTEMPTS: ${WECOM_MAX_ATTEMPTS:-3}
      WECOM_REQUEST_TIMEOUT_SECONDS: ${WECOM_REQUEST_TIMEOUT_SECONDS:-15}
      WECOM_MAX_IMAGE_BYTES: ${WECOM_MAX_IMAGE_BYTES:-10485760}
      WECOM_MAX_TEXT_BYTES: ${WECOM_MAX_TEXT_BYTES:-2048}
      WECOM_GROUP_MAX_IMAGE_BYTES: ${WECOM_GROUP_MAX_IMAGE_BYTES:-2097152}
      WECOM_GROUP_MAX_TEXT_BYTES: ${WECOM_GROUP_MAX_TEXT_BYTES:-4096}
    command: ["python", "-m", "app.wecom_dispatcher_main"]

volumes:
  postgres_data:
  minio_data:
