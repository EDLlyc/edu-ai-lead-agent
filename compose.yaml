name: edu-ai-lead-agent

x-app-runtime: &app-runtime
  # Local development builds and tags this image. Production sets APP_IMAGE to a validated
  # registry/repository@sha256 digest and always invokes Compose with --no-build.
  image: ${APP_IMAGE:-edu-ai-lead-agent-backend:local}
  build:
    context: ./backend

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edu_ai}
      POSTGRES_USER: ${POSTGRES_USER:-edu_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edu_ai_local_change_me}
      TZ: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edu_ai_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-edu_ai_minio_local_change_me}
      TZ: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edu_ai_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-edu_ai_minio_local_change_me}
      MINIO_BUCKET: ${MINIO_BUCKET:-edu-ai-materials}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        /usr/bin/mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        /usr/bin/mc anonymous set none "local/$${MINIO_BUCKET}"

  backend-migrate:
    <<: *app-runtime
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment: &backend-environment
      APP_ENV: ${APP_ENV:-development}
      APP_BROWSER_ORIGINS: ${APP_BROWSER_ORIGINS:-http://127.0.0.1:5173}
      BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-edu_ai}:${POSTGRES_PASSWORD:-edu_ai_local_change_me}@postgres:5432/${POSTGRES_DB:-edu_ai}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-edu-ai-materials}
      MINIO_SECURE: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-edu_ai_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-edu_ai_minio_local_change_me}
      ACQUISITION_SCHEDULE_HOUR: ${ACQUISITION_SCHEDULE_HOUR:-6}
      ACQUISITION_SCHEDULE_MINUTE: ${ACQUISITION_SCHEDULE_MINUTE:-30}
