name: edu-ai-lead-agent

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edu_ai}
      POSTGRES_USER: ${POSTGRES_USER:-edu_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edu_ai_local_change_me}
      TZ: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edu_ai_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-edu_ai_minio_local_change_me}
      TZ: ${BUSINESS_TIMEZONE:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edu_ai_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-edu_ai_minio_local_change_me}
      MINIO_BUCKET: ${MINIO_BUCKET:-edu-ai-materials}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        /usr/bin/mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        /usr/bin/mc anonymous set none "local/$${MINIO_BUCKET}"

volumes:
  postgres_data:
  minio_data:
