<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--muted:#667085;--line:#e3e6ea;--accent:#2563eb;--yes:#15803d;--no:#b42318;--skip:#6b7280}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--ink:#e8eaed;--muted:#9aa3ae;--line:#2c3038;--accent:#6aa0ff;--yes:#4ade80;--no:#f87171;--skip:#9ca3af}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;margin:0 0 4px}.hint{color:var(--muted);font-size:14px;margin:0 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer;font-size:15px}
.tab.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.q{font-size:15px;color:var(--muted);margin-bottom:10px}.title{font-size:20px;font-weight:600;margin:0 0 10px}
.meta{font-size:13px;color:var(--muted);margin-bottom:8px}.sum{font-size:15px;color:var(--ink);opacity:.85}
.pair{display:grid;gap:10px}.pair div{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:17px}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px}
.btns button{padding:14px 8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}
.btns .y{border-color:var(--yes)}.btns .n{border-color:var(--no)}.btns .s{border-color:var(--skip)}
.btns button.picked{color:#fff}.btns .y.picked{background:var(--yes)}.btns .n.picked{background:var(--no)}.btns .s.picked{background:var(--skip)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:14px}
.nav button,.export{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.export{display:block;width:100%;margin-top:18px;padding:12px;font-size:16px;border-color:var(--accent);color:var(--accent)}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 5px}

<script>
const DATA = {"news": [{"id": "t-71820609", "title": "2026教育创新与高质量发展成果征集活动启动", "summary": "新华网启动“2026教育创新与高质量发展成果征集活动”，征集时间为2026年8月12日至11月30日，面向全国各级各类组织征集涵盖教育家精神践行、AI+教育融合创新等十个方向的教育创新成果，入选项目有机会孵化为长线教育特色IP。", "source": "新华网教育", "date": "2026-09-10"}, {"id": "t-c641e709", "title": "国务院关于《特殊教育发展提升“十五五”行动计划》的批复", "summary": "国务院批复同意《特殊教育发展提升“十五五”行动计划》，要求各地各部门认真组织实施，加快建设高质量特殊教育体系，促进特殊教育数字化、普惠发展，充分保障残疾儿童青少年受教育机会。", "source": "中国政府网政策", "date": "2026-09-21"}, {"id": "t-f327fa79", "title": "【教育部简报】北京师范大学推进高水平师范院校建设 助力基础教育高质量发展", "summary": "北京师范大学推进高水平师范院校建设,通过高素质教师培养、高水平科学研究、高质量教师培训和高站位社会服务助力基础教育高质量发展。实施“强师工程”“优师计划”等聚焦中西部欠发达地区,创新师范生培养模式,深化校际合作。研发“AI大先生”等智能体探索教育数字化转型,并承担大量教师培训任务,构建覆盖广泛的基础教育办学体系与协同创新网络。", "source": "北京师范大学", "date": "2026-09-17"}, {"id": "t-63c5c096", "title": "聚焦“共创AI新经济” 2026外滩大会在沪举行", "summary": "2026 Inclusion·外滩大会于9月9日至12日在上海举行，主题为“共创AI新经济”，设有1.5万平方米科技展，吸引全球300多家科技企业参展，展示了30余个智能体应用及40余家企业的具身智能技术在多场景中的应用。", "source": "新华网科技", "date": "2026-09-29"}, {"id": "t-f5c2ed99", "title": "研究揭示滨海潮滩地下环境氮循环调控机制", "summary": "中国科学院烟台海岸带研究所研究团队揭示了潮汐驱动的地下水流动调控溶解无机氮迁移转化及向近海输出的机制，发现滨海潮滩是具有高度调控能力的活性反应界面，而非简单的营养盐输送通道。相关成果发表在《水文学杂志》上。", "source": "中国科学院", "date": "2026-09-13"}, {"id": "t-d77b4057", "title": "长效神经融合脑机界面研究取得进展", "summary": "中国科学院理化技术研究所等科研团队研发出多功能阳离子交替肽电极界面涂层，兼顾生物相容性、广谱抗菌、抗蛋白与离子黏附、强效抑制异物反应四大特性，在动物模型中完成长达300天连续在体电生理测试，综合性能优于传统裸电极，为长效脑机接口临床转化提供通用解决方案。相关成果发表在《先进材料》上。", "source": "中国科学院", "date": "2026-09-29"}, {"id": "t-6f0c49af", "title": "中国语言资源保护工程成果展示馆开馆", "summary": "中国语言资源保护工程成果展示馆在湖南长沙开馆，沈晓明宣布开馆，任友群、唐炜致辞，哈立德·阿纳尼致信祝贺。展示馆以数字化技术呈现1800余个点位语言资源，现场成立语言科技赋能联盟并发布长沙倡议及100项创新项目案例。", "source": "教育部", "date": "2026-09-01"}, {"id": "t-7480f880", "title": "开学季，给孩子做好健康储备", "summary": "多位医学专家从作息调整、护眼、防疫、护脊等方面为家长提供开学季儿童健康储备建议，涵盖早睡早起渐进调整、中医内调外护护眼、学校与家庭防疫措施、科学坐姿与脊柱侧弯筛查等内容。", "source": "光明网教育", "date": "2026-09-29"}, {"id": "t-54aeb7b4", "title": "暑期总务后勤保障工作系列报道（二）：学生宿舍修缮提升", "summary": "总务部暑期在北京校区多个校园开展18项修缮工程，包括更换学1至学4楼宿舍家具及粉刷修缮多栋宿舍楼，以提升校园环境与住宿体验。", "source": "北京师范大学", "date": "2026-09-10"}, {"id": "t-2b00a409", "title": "“中国挤压”论是对中国的又一次抹黑", "summary": "国家发展改革委新闻发言人李超在8月28日新闻发布会上严正批驳外国智库提出的\"中国挤压\"论调，指出该论调基于零和博弈、旨在维护自身霸权。她强调中国工业化立足国情，为发展中国家提供借鉴，并以实际行动为全球南方国家工业化、绿色化发展提供支持。", "source": "科技日报", "date": "2026-09-19"}, {"id": "t-b915aac5", "title": "北京师范大学举行2026级新生开学典礼", "summary": "北京师范大学于9月7日和9月9日分别在北京校区和珠海校区举行2026级新生开学典礼。校长于吉红等校领导出席，教师代表、在校生代表及新生代表发言，典礼通过多平台双语直播。", "source": "北京师范大学", "date": "2026-09-11"}, {"id": "t-4c91e8a1", "title": "北京师大资产经营有限公司赴人工智能学院开展科技成果转化专题调研", "summary": "9月20日上午，北京师大资产经营有限公司赴人工智能学院开展科技成果转化专题调研，双方围绕人工智能科研成果的场景落地、产品化路径、产学研合作模式等展开交流，旨在推动科研成果走出实验室、服务教育高质量发展。", "source": "北京师范大学", "date": "2026-09-24"}, {"id": "t-ef74bd3a", "title": "“西部低空之城”上演科创对决 2026全国青少年电子制作锦标赛开赛", "summary": "2026全国青少年电子制作锦标赛于8月9日在重庆梁平开赛，来自全国20多个省市的2600余名青少年选手参赛，赛事设置12个竞赛项目并分为四个年龄组别，是国内青少年电子科创领域极具影响力的国家级品牌赛事。", "source": "中新网教育", "date": "2026-09-29"}, {"id": "t-f4389c12", "title": "教育部提醒: 新生入学季，这四类诈骗要警惕", "summary": "教育部在新手入学季发布防范提醒，揭露四类常见诈骗套路：谎称有内部指标、以补录名额收取高额费用、利用AI伪造录取通知书骗取费用、虚构学长学姐人设实施诈骗，并提醒考生及家长通过官方渠道核实信息。", "source": "光明网教育", "date": "2026-09-29"}, {"id": "t-f440cbf3", "title": "拆掉学段“围墙” 共绘育人“底色”", "summary": "报道全国推进大中小学思政课一体化建设的实践，涵盖教学衔接、机制创新及育人成效。", "source": "光明网教育", "date": "2026-09-25"}, {"id": "t-f90dbb19", "title": "一腔赤诚育桃李——走近2026年“最美教师”群体", "summary": "中央宣传部与教育部在第四十二个教师节之际发布了2026年“最美教师”先进事迹。这些教师作为全国1870多万名教师的优秀代表，在特殊教育、乡村教育、职业教育及高等教育等领域展现了教育家精神。他们不仅用爱心守护学生成长，还积极顺应时代变革，将数字技术、虚拟仿真等前沿手段融入教学与科研，将论文写在祖国大地上，服务国家所需。", "source": "新华网教育", "date": "2026-09-14"}, {"id": "t-4fd7409d", "title": "科研团队让已灭绝的“奥氏马”容貌再现", "summary": "吉林大学生物考古实验室与美国进化科技有限责任公司联合攻关，在全球首次完成已灭绝古生物“奥氏马”的完整形态复原，证实其为马属动物第四个独立亚属，并打通了古基因组证据到实体形态复原的完整研究链条。", "source": "科技日报", "date": "2026-09-15"}, {"id": "t-2ef18e49", "title": "让科学家成为抬头可见的“星”", "summary": "全国多地商圈主动将商场大屏、户外广告核心位置留给宣传功勋科学家的公益海报，获得民众广泛点赞。此举旨在让科学家成为青少年抬头可见的榜样，使科学家精神在日常生活中浸润青少年心灵，启示弘扬科学家精神的场所不限于课堂，商圈、地铁站、城市广场均可成为传递窗口。", "source": "光明网教育", "date": "2026-09-14"}, {"id": "t-0f6b3bd5", "title": "2026国际产学研用合作会议（东北三省一区）举办", "summary": "2026国际产学研用合作会议(东北三省一区)于9月15日在吉林长春开幕,教育部副部长任友群出席并致辞。会议主题为“融通中外·协同创新——国际产学研用合作赋能东北高质量发展”,约400名来自26个国家和地区的代表参会,发布合作成果32项。", "source": "教育部", "date": "2026-09-18"}, {"id": "t-cf664dc9", "title": "中国内地高校全球冠军学科增至22个", "summary": "据软科15日发布的2026“软科世界一流学科排名”显示，中国内地高校在化学和海洋科学2个学科首度问鼎世界第一，首次在理学领域收获全球冠军，全球冠军学科增至22个。美国高校在27个学科占据榜首。中国内地上榜高校数量达394所，浙江大学以57个上榜学科数登顶中国内地第一。", "source": "光明网教育", "date": "2026-09-16"}, {"id": "t-30839ccc", "title": "激光反射层析实现3.3公里距离下无扫描的高分辨非视域成像", "summary": "中国科学院光电技术研究所团队将激光反射层析成像方法引入非视域成像领域，以漫反射中继墙面为天然激光扩束器，通过单点探测结合目标旋转的多角度投影数据实现隐藏场景高精度重建。该方法突破了传统扫描式非视域成像的速率—分辨率矛盾，在室内近距离条件下空间分辨率提升约2倍、成像速率提高约91倍，并在远距离外场实验中实现了3.3公里距离、约3分钟采样、优于3厘米空间分辨率的", "source": "中国科学院", "date": "2026-09-29"}, {"id": "t-6ace144c", "title": "总编辑圈点丨激光退火把光隔离器直接集成于硅光子芯片，不伤及周边组件", "summary": "日本京瓷公司与东北大学电气通信研究所开发出一种新型激光退火技术，通过局部加热磁光石榴石薄膜，将光隔离器直接集成到硅光子芯片上而不损伤周边组件。实验显示该技术使光通信波长范围内的反射光减少约95%。", "source": "科技日报", "date": "2026-09-19"}, {"id": "t-de215d41", "title": "孩子写作业先问AI，家长怎么办", "summary": "文章探讨了中小学生使用AI辅助完成作业带来的教育焦虑与挑战。专家和教师指出，长期依赖AI会削弱学生的思维深度、创造力与抽象化能力，建议家长参考“红线”与“绿线”划定AI使用边界。同时，针对火热的AI研学市场，提醒家长避免焦虑，注重培养孩子的逻辑思维与人机协作素养。此外，专家呼吁在基础教育阶段构建AI应用分类分级治理体系，并建立大模型白名单制度，以防范AI沦为", "source": "中新网教育", "date": "2026-09-07"}, {"id": "t-df246b93", "title": "细胞聚集体浸润机制研究取得进展", "summary": "中国科学院理化技术研究所科研团队基于肿瘤相关胶原特征(TACS-3)，利用飞秒激光无掩模投影光刻构建仿生微结构，研究肿瘤细胞集体浸润机制。研究发现辐射状结构诱导多方向快速辐射式浸润，平行线型结构诱导单向受限轨道式浸润，揭示了拓扑结构对浸润速度和方向性的调控作用。成果发表于《国家科学评论》。", "source": "中国科学院", "date": "2026-09-29"}, {"id": "t-c102b7ec", "title": "调查显示短视频和网游成中小学生暑期消时“两件套”", "summary": "中国青年报社社会调查中心联合问卷网对1335名中小学生家长的调查显示，刷短视频(62.3%)和玩网络游戏(54.8%)成为中小学生暑期消时主要方式，家长对孩子假期上网时长满意度平均仅6.4分(满分10分)，66.1%的受访家长呼吁加强平台监管并落实防沉迷机制。", "source": "中新网教育、光明网教育", "date": "2026-09-29"}, {"id": "t-3df183fb", "title": "赛迪顾问：国家高新区科技创新与产业创新深度融合的实践举措", "summary": "国家高新区围绕技术熟化、市场验证、供需匹配、资本赋能四大关键通道系统施策，推动科技创新与产业创新深度融合。通过强化中试服务、场景服务、科技中介服务与金融服务，打通创新成果转化堵点，加快发展新质生产力。", "source": "新华网科技", "date": "2026-09-24"}, {"id": "t-48ecda26", "title": "万千灯火耀新程", "summary": "全国教育大会召开两年来，中国通过弘扬教育家精神、深化教师培养培训改革以及落实惠师政策，推进高水平教师队伍建设。教育部实施“国优计划”、“国培计划”及数字化赋能行动，并宣布将实施教师发展国家行动，以建设教育强国。", "source": "光明网教育", "date": "2026-09-29"}, {"id": "t-5f94a4c5", "title": "6G将让机器人“更丝滑” 张平院士：通感一体重塑具身智能", "summary": "2026年3月27日，在2026中关村论坛年会6G技术与产业创新论坛上，中关村泛联院理事长、北京邮电大学教授张平院士接受新华网采访时表示，6G将通过通感一体化、意图传输与实时交互，破解当前具身智能与机器人落地中动作卡顿等'不丝滑'难题，推动人工智能真正扎根实体经济。", "source": "新华网科技", "date": "2026-09-29"}, {"id": "t-f5d1892c", "title": "李强出席2026年世界技能大会开幕式并致辞", "summary": "2026年9月23日，国务院总理李强在上海出席2026年世界技能大会开幕式并致辞，阐述了中国在技能发展方面的实践与贡献，并提出携手共创技能发展美好前景的倡议，包括积极开展人工智能通识教育等。", "source": "中国政府网要闻", "date": "2026-09-24"}, {"id": "t-ab337133", "title": "总编辑圈点丨人脑类器官在小鼠体内形成功能性神经网络，实验在严格伦理指导下进行", "summary": "美国斯坦福大学研究团队在《自然》发表研究表明，通过培育大脑皮层部分区域缺失的小鼠，成功将人脑类器官移植到小鼠体内并实现功能性神经网络整合。移植的类器官分化为多种人类脑细胞并影响小鼠行为，该实验在严格伦理指导下进行，团队强调需制定适当规范以应对社会、医学和伦理影响。", "source": "科技日报", "date": "2026-09-17"}, {"id": "t-b5b7013e", "title": "携手开启金砖合作新的\"金色十年\"——国际社会对中国明年接任金砖主席国满怀期待", "summary": "国际社会对中国明年接任金砖主席国满怀期待，认为中国将引领金砖大家庭开启第三个\"金色十年\"。多国人士高度评价中国在金砖合作机制中的贡献，期待在创新、绿色、人文及全球治理等领域深化合作。", "source": "中国政府网要闻", "date": "2026-09-21"}, {"id": "t-f99b2dde", "title": "科研后备军的一场“精神入伍式”——记2026年“把青春华章写在祖国大地上”大思政课", "summary": "2026年9月6日晚，2026年“把青春华章写在祖国大地上”大思政课活动在中国科学技术大学启动，多位科学家与企业家分享科研与创业经历，寄语青年学子勇攀科技高峰、将个人奋斗融入国家发展。", "source": "科技日报", "date": "2026-09-24"}, {"id": "t-5531e9e7", "title": "科研人员提出机器学习辅助的“材料—结构—功能”协同设计新策略", "summary": "中国科学院合肥物质科学研究院团队提出机器学习辅助的\"材料—结构—功能\"协同设计策略,采用3D打印技术将PACF吸波单元、N-PA间隔层和LI-PACF功能背板集成为多级谐振梯度阻抗超结构,实现2至40GHz宽频宽角微波吸收,兼具结构承载和电热除冰能力。成果发表于《化学工程杂志》。", "source": "中国科学院", "date": "2026-09-09"}, {"id": "t-7b3d06df", "title": "“小候鸟”的暑期夏令营", "summary": "8月13日，13名外来务工人员子女在中建三局浙江大学医学院附属第一医院国家医学中心(筹)暨浙江大学医学院附属第一医院余杭院区二期建设工程项目部参加“小候鸟”暑期夏令营活动，体验手工艺制作，参观工程项目展示厅，并在杭州市余杭区仓前街道朱庙社区学习交通安全及反诈知识。", "source": "光明网教育", "date": "2026-09-29"}, {"id": "t-588993f3", "title": "北京师范大学党委理论学习中心组：系统性重塑师范育人新范式", "summary": "北京师范大学深入实施“强师工程”，构建从招生到职后支持的全链条闭环育人体系，通过“优师计划”“国优计划”等多元化路径重塑师范育人新范式，并打破职前职后边界赋能教师全程发展。", "source": "北京师范大学", "date": "2026-09-27"}, {"id": "t-683c6413", "title": "“天宫课堂”第五课即将开讲！太空厨房和菜园亮相，最新剧透", "summary": "“天宫课堂·港澳专场”太空授课活动举行，神舟二十三号乘组航天员朱杨柱、张志远、黎家盈为港澳学生进行太空授课并天地互动，展示空间站三舱布局、太空厨房和太空菜园，通过3颗中继卫星及2颗备份卫星保障天地通信。", "source": "科技日报", "date": "2026-09-09"}, {"id": "t-2c458932", "title": "民族团结主题音乐剧《织梦》在北师大珠海校区上演", "summary": "2026年9月17日晚，为宣传《中华人民共和国民族团结进步促进法》，主题音乐剧《织梦》在北京师范大学珠海校区上演。该剧以广东援疆产业项目为背景，展现粤疆各族群众交往交流交融的故事。现场同步开展普法宣传与成果展示，吸引1300余人观看。", "source": "北京师范大学", "date": "2026-09-29"}, {"id": "t-cde0e807", "title": "从“物理外挂”到“中国鹰眼”——2026服贸会首钢园探营", "summary": "2026服贸会将在北京首钢园举办，展示外骨骼机器人、AI智能体平台、9分钟闪充电池、核能创新成果及AI鹰眼系统等多项科技与服务融合的新形态。", "source": "新华网科技", "date": "2026-09-09"}, {"id": "t-669bb3a9", "title": "暑期总务后勤保障工作系列报道（一）：道路交通与环境治理", "summary": "2026年暑期，总务部在北京校区多个区域开展18项修缮工程，涵盖京师大厦北侧空间优化、学五宿舍东侧道路翻新、学三学四宿舍北侧人行道拓宽及环境治理、家属区东北门和西北门改造等，以精细化低成本举措推动校园环境升级。", "source": "北京师范大学", "date": "2026-09-29"}, {"id": "t-b9dfeb82", "title": "民航暑运收官，1.51亿人次客流里的新变化", "summary": "2024年为期62天的民航暑运于8月31日结束，期间全国民航累计运送旅客1.51亿人次，同比增长2.9%。避暑游带动部分旅游城市客流大幅增长，出入境市场持续回暖。同时，民航服务保障更加细致，推出了无陪儿童、老年人慢服务及宠物进客舱等多元化服务。9月上半月机票预订量依然稳中有增。", "source": "科技日报", "date": "2026-09-29"}, {"id": "t-bc645b1d", "title": "丁薛祥在安徽合肥出席财政科学管理试点座谈会时强调 落实当家理财责任 提升财政工作水平 更好服务和保障中国式现代化建设", "summary": "2026年8月25日至26日，中共中央政治局常委、国务院副总理丁薛祥在安徽合肥出席财政科学管理试点座谈会并调研，强调要落实当家理财责任，提升财政工作水平，实施更加积极的财政政策，完善中央和地方财政关系，化解地方政府隐性债务风险，更好服务和保障中国式现代化建设。", "source": "中国政府网要闻", "date": "2026-09-29"}, {"id": "t-9ecd47ae", "title": "习近平同英国首相伯纳姆通电话", "summary": "2026年9月8日晚，国家主席习近平应约同英国首相伯纳姆通电话。习近平祝贺伯纳姆就任英国首相，指出中英两国共同利益大于分歧，应互尊互信、求同存异，做大互利合作的蛋糕。双方就发展经济、改善民生、扩大教育医疗金融等领域对外开放、加强科技教育文化体育交流、维护多边主义和开放贸易等达成共识。伯纳姆表示英方愿保持对华政策连续性，坚定不移发展英中长期稳定的战略伙伴关系，", "source": "中国政府网要闻", "date": "2026-09-29"}, {"id": "t-2d3d3c35", "title": "应时代之变 行天下大道——习近平主席引领推动构建更加公正合理的全球治理体系", "summary": "2025年9月1日，习近平主席在天津主持“上海合作组织+”会议时提出全球治理倡议。一年来，该倡议获得近160个国家和国际组织支持，中国通过发布白皮书、成立世界人工智能合作组织等务实举措推动倡议落地，致力于构建更加公正合理的全球治理体系。", "source": "中国政府网要闻", "date": "2026-09-22"}, {"id": "t-a675cdb5", "title": "痛别！管华诗院士逝世", "summary": "中国工程院院士、中国海洋大学原校长管华诗同志因病于2026年9月4日在青岛逝世，享年87岁。他是中国现代海洋药物学科的开拓者与奠基人，曾主持研制我国第一个现代海洋药物，并为海洋科技事业及高等教育改革作出重要贡献。", "source": "科技日报", "date": "2026-09-29"}, {"id": "t-d487943b", "title": "为中埃关系深入发展擘画新蓝图——埃及各界期待习近平主席对埃进行国事访问", "summary": "埃及各界期待习近平主席在埃中建交70周年之际对埃及进行国事访问，认为此访将赓续传统友谊、深化全面战略伙伴关系，推动双边关系朝构建面向新时代命运共同体的目标前行。双方在经贸基建、新兴科技、人文交流等领域合作成果丰硕，期待进一步挖掘人工智能、云计算等前沿合作潜能。", "source": "中国政府网要闻", "date": "2026-09-07"}, {"id": "t-c4be8b83", "title": "养老服务需求持续释放 为青年就业打开广阔天地", "summary": "养老服务需求持续释放，催生适老化改造设计师、养老服务师、认知障碍照护员等新职业，为青年就业打开广阔天地。目前养老护理人才缺口达950万人，专家建议青年学子转变刻板印象，跨学科学习并投身银发经济赛道。", "source": "光明网教育", "date": "2026-09-18"}, {"id": "t-b5b756c0", "title": "推动构建更加公正合理的全球治理体系——习近平主席引领推动全球治理倡议走深走实", "summary": "资料主要阐述习近平主席提出的全球治理倡议及其核心理念、国际实践与未来蓝图。其中涉及人工智能治理领域的内容包括：提出加强人工智能发展战略、治理规则、技术标准的对接协调以形成全球治理框架；在2026世界人工智能大会上系统提出完善全球人工智能治理的中国方案，包括以人为本、帮助全球南方缩小智能鸿沟、成立世界人工智能合作组织及支持联合国相关进程等。", "source": "中国政府网要闻", "date": "2026-09-10"}, {"id": "t-8c8076ed", "title": "孤独症早筛早干预呼唤全社会合力护航", "summary": "2026年7月国务院残疾人工作委员会印发《残疾人保障和发展\"十五五\"规划》，首次将\"孤独症全生命周期关爱促进行动\"单列专栏，打通0岁筛查、儿童康复、融合教育、大龄就业、终身托养、家庭支持六大政策链条。我国孤独症群体超1300万人，新规终结了过去各环节政策割裂的碎片化格局。专家指出早筛早干预最大阻碍在于认知层面，约九成轻症谱系儿童若早识别早干预，70%—75%", "source": "光明网教育", "date": "2026-09-29"}, {"id": "t-7d51263b", "title": "教育部调度部署2026年秋季开学工作", "summary": "8月27日,教育部开展全国中小学幼儿园秋季开学工作视频调度,系统部署秋季开学重点工作,要求各地各校守牢政治安全红线、守住校园安全防范底线、严格规范办学行为、全面加强开学条件保障、科学谋划教育教学工作,确保新学期安全平稳有序开学。", "source": "教育部", "date": "2026-09-17"}, {"id": "t-86c940c2", "title": "怀进鹏向中国—吉尔吉斯斯坦卓越工程师学院揭牌仪式发表视频致辞", "summary": "中国—吉尔吉斯斯坦卓越工程师学院在吉尔吉斯斯坦比什凯克举行揭牌仪式，教育部部长怀进鹏发表视频致辞，指出该项目聚焦绿色矿业、智慧能源等领域开展工程硕博士联合培养，是中吉教育合作的标志性项目。", "source": "教育部", "date": "2026-08-31"}, {"id": "t-e7bf34be", "title": "绿色与AI加速融合 中国轨道交通技术亮相柏林", "summary": "在第十五届柏林国际轨道交通技术博览会上，中国轨道交通企业集中展示了绿色低碳与人工智能加速融合的新产品与新技术。中国中车发布了数智融合地铁列车等实车，华为发布了“智慧轨道2.0”解决方案，展现了产业升级与参与全球技术创新的趋势。", "source": "新华网科技", "date": "2026-09-29"}, {"id": "t-fe1e5ab2", "title": "商汤科技董事长兼CEO徐立：什么是好的人工智能产品？", "summary": "2026年7月18日，商汤科技在\"基座大模型架构创新与生态合作论坛\"上发布面向长程任务的交付级原生多模态智能体基座——日日新SenseNova U1 Pro。董事长兼CEO徐立阐述好AI产品的两个维度：能力拓界与个人成长。商汤旗下小浣熊、Seko、咔皮家族等产品分别面向产业生产力、内容创作和个人智能场景，服务用户规模达数千万级。", "source": "商汤科技", "date": "2026-09-29"}, {"id": "t-a5ebbec8", "title": "第十四届全国大学生化学实验竞赛总决赛在北京师范大学举办", "summary": "第十四届全国大学生化学实验竞赛总决赛于8月10日至13日在北京师范大学举行，由教育部高等学校化学教育研究中心等单位主办，北京师范大学化学学院承办。共有155所高校的201名学生参赛，规模创历史之最。比赛产生了一等奖40名等奖项，期间还举办了化学实验教学研讨会。", "source": "北京师范大学", "date": "2026-09-29"}, {"id": "t-a7799237", "title": "数学AI首次与高中生同台竞技 2026年中国东南地区数学交流活动在榕闭幕", "summary": "2026年暑假，为期六天的中国东南地区高中数学交流活动在福建省福州市福清京师学校落幕。活动首次引入数学AI与选手同步同台竞技，AI斩获高一组金牌及高二组银牌。上海市民办华育中学包揽高一、高二团体冠军。活动期间多位学者作学术报告，并举行会旗交接仪式。", "source": "新华网教育", "date": "2026-09-29"}, {"id": "t-9431061d", "title": "第九届全国青少年人工智能创新挑战赛侧记：青春智慧点亮科技之光", "summary": "第九届全国青少年人工智能创新挑战赛决赛于8月15日至16日在浙江乌镇举行，近8000名青少年参赛。大赛已连续举办9届，累计61万人参加，越来越侧重实践能力和综合素养考察，参赛选手趋于低龄化。", "source": "新华网教育", "date": "2026-09-29"}, {"id": "t-bd2901d4", "title": "办公智能体赛道分化 本地大模型加速融入", "summary": "随着行业巨头发力办公智能体赛道，基于本地大模型的赛道正加速融入办公场景。企业出于隐私和保密需求对本地大模型存在刚性需求，这被硬件厂商和中小AI团队视为新商业机遇。经过后训练的中小参数大模型智能化水平快速提升，在特定办公场景中展现出应用价值，但从“能用”到“好用”仍需解决数据与应用执行等门槛问题。", "source": "新华网科技", "date": "2026-09-28"}, {"id": "t-508b0145", "title": "汇聚起教育强国建设的强大合力", "summary": "在第四十二个教师节到来之际，习近平总书记向全国广大教师和教育工作者致以节日祝贺和诚挚问候。文章指出1870多万名教师支撑起世界上规模最大且高质量的教育体系，强调在“十五五”新局下教育强国建设进入关键阶段，要求落实立德树人根本任务、全方位提升教师素养以铸就强国良师，并呼吁各级党委政府提高教师地位待遇、全社会营造尊师重教氛围，汇聚起教育强国建设的强大合力。", "source": "光明网教育", "date": "2026-09-10"}, {"id": "t-77469b0c", "title": "第五届数贸会将首创Token主题AI未来展区", "summary": "第五届全球数字贸易博览会将于9月23日至27日在杭州举办，主题为“在数贸会遇见AI未来”，首创Token主题AI未来展区，展示算力底座、大模型及AI应用场景等全产业链生态。", "source": "科技日报", "date": "2026-09-09"}, {"id": "t-624ff89e", "title": "科研人员发现极端气候事件影响土壤抗生素抗性基因新规律", "summary": "中国科学院东北地理与农业生态研究所等机构的研究揭示了极端气候事件对土壤抗生素抗性基因(ARGs)的差异化影响规律。研究发现，热浪会引起最明显且方向一致的ARGs丰度下降，而干旱、洪涝和冻融引起的总体变化较弱。研究提出“代谢—遗传权衡”框架解释急性热胁迫下微生物的响应机制，并发现随机森林模型能较好预测极端气候事件后土壤抗性基因组成的变化幅度。该研究改变了“气候", "source": "中国科学院", "date": "2026-09-15"}, {"id": "t-270ca910", "title": "“人工智能与思想政治教育”学术研讨会在东北大学召开", "summary": "中国历史唯物主义学会科技进步与社会发展专委会2026年度学术年会暨\"人工智能与思想政治教育\"学术研讨会于2026年8月9日在东北大学召开。会议由中国历史唯物主义学会科技进步与社会发展专委会和东北大学主办，围绕人工智能与思想政治教育数字化转型、人工智能赋能精准思政等议题展开深度研讨。", "source": "中新网教育", "date": "2026-09-10"}, {"id": "t-2e34b733", "title": "人工智能或可唤醒“沉睡”的文化宝藏", "summary": "中央民族大学毕晓君课题组利用人工智能技术构建东巴文等少数民族古籍数据集和多模态大模型，实现文字识别、修复和翻译，为低资源语言处理和民族文化研究提供新工具。", "source": "新华网科技", "date": "2026-09-29"}, {"id": "t-e81270b6", "title": "北京外国语大学：贯彻落实回信精神，着力培养 “三有” 人才", "summary": "北京外国语大学贯彻落实习近平总书记给老教授的回信精神，通过编写“三进”系列教材、开设相关课程、开展教师培训以及打造全球“大思政课”等创新实践，着力培养“三有”人才，推动习近平新时代中国特色社会主义思想进课堂、进教材、进学生头脑。", "source": "新华网教育", "date": "2026-09-29"}, {"id": "t-138e5013", "title": "教育部公布2025年国家关键领域语言科技赋能创新项目案例名单", "summary": "2025年11月，国家语委开展了国家关键领域语言科技赋能创新项目案例征集活动，经集中申报、资格核验、专家遴选、网络公示等环节，确定了2025年国家关键领域语言科技赋能创新项目案例名单。教育部、国家语委将以数字中文建设为重点，落实《教育发展\"十五五\"规划》部署，推进语言文字与信息技术深度融合。", "source": "新华网教育", "date": "2026-09-29"}, {"id": "t-2dd132e3", "title": "2026“百县对百校促就业行动”校地人才供需对接会在无锡宜兴举办", "summary": "2026“百县对百校促就业行动”校地人才供需对接会于8月9日在江苏无锡宜兴举办，由教育部和人力资源社会保障部联合主办。活动采取“百县带岗位需求、百校带生源信息”的创新形式，吸引了全国78个百强县市的511家优质企业参与，提供超1.3万个就业岗位，覆盖20余个行业领域，旨在促进高校毕业生高质量充分就业。", "source": "教育部", "date": "2026-09-29"}, {"id": "t-800b3333", "title": "研究揭示溶剂占据调控分子筛微孔催化扩散机制", "summary": "中国科学院大连化学物理研究所科研团队在分子筛限域催化与分子扩散机制研究方面取得进展，提出溶剂门控概念，发现溶剂分子在孔道内的竞争吸附与空间占据可调控反应分子对微孔内部活性位的实际可达性，相关成果发表在《美国化学会志》上。", "source": "中国科学院", "date": "2026-09-27"}, {"id": "t-7d282698", "title": "在服贸会看AI点亮“教与学”新场景", "summary": "2026年服贸会教育服务专题展上，多家企业展示了AI在托幼、家庭伴学、校园教学等领域的落地成果，包括“育见京小宝”托幼平台、斑马儿童教育大模型及“AI智学伴”解决方案，推动个性化教育与教学效率提升。", "source": "中新网教育", "date": "2026-09-29"}, {"id": "t-925f4841", "title": "研究构建开源小麦幼苗建成性状评价平台", "summary": "中国科学院分子植物科学卓越创新中心等研究团队结合生成式人工智能(GenAI)、超低空无人机表型采集技术及深度学习算法，构建了开源小麦幼苗建成性状评价平台LeafTip-RN，实现了对小麦出苗过程的大规模、高通量动态表型量化分析，相关成果发表在《实验植物学杂志》上。", "source": "中国科学院", "date": "2026-09-29"}, {"id": "t-41f909d8", "title": "首个全国校园网络文明月集中展示活动举行", "summary": "首个全国校园网络文明月集中展示活动在北京大学举行，教育部副部长熊四皓出席并讲话。活动强调加强校园网络文明建设，发布《学校网络思想政治教育发展蓝皮书》及人工智能赋能思政教育应用场景，并启动第九届全国大学生网络文化节等活动。", "source": "教育部", "date": "2026-09-25"}, {"id": "t-e0bcc613", "title": "近日，商汤科技联合沙特国家校车运营管理机构达成合作，打造以人工智能为核心的全国智慧校车一体化数字管理平台。作为覆盖沙特全国的国家级学生出行数字基础设施，该平台将面向全国超过120万名学生，构建贯穿上下学全流程的端到端数字化管理体系，实现校车运营、安全监管、服务协同和数据治理的一体化升级，为沙特教育数字化和公共服务现代化建设提供重要支撑。", "summary": "商汤科技联合沙特国家校车运营管理机构达成合作，打造以人工智能为核心的全国智慧校车一体化数字管理平台，面向全国超过120万名学生，构建贯穿上下学全流程的端到端数字化管理体系，为沙特教育数字化和公共服务现代化建设提供支撑。", "source": "商汤科技", "date": "2026-09-15"}, {"id": "t-ac44e5c3", "title": "“北京欢迎你”秋季京外校招启动 将赴16省市30所高校揽才", "summary": "北京市2026年秋季京外校园招聘系列活动启动，首场活动在复旦大学举行。活动将赴16个省市30所重点高校揽才，600余家用人单位提供近万个岗位，聚焦人工智能、集成电路等重点产业人才需求。", "source": "光明网教育", "date": "2026-09-29"}, {"id": "t-ec90e6cd", "title": "总编辑圈点丨“先导组装”可精准实现长DNA片段的缝合，并一次修复多个突变", "summary": "美国波士顿儿童医院研究团队在《自然》杂志发表名为“先导组装”的基因组编辑新方法。该技术能将长DNA片段精准缝合到活细胞基因组的特定位点，并在一轮操作中同时修复多个突变，且不易发生脱靶效应，有望为遗传病提供通用治疗方案。", "source": "科技日报", "date": "2026-09-21"}, {"id": "t-b395bc1e", "title": "全国青少年人工智能创新挑战赛：培养孩子从“有兴趣”到“有志向”", "summary": "全国青少年人工智能创新挑战赛历经9届发展，参赛人数从首届1万余人增长至第九届17万人，覆盖大陆31个省区市及港澳台地区。大赛已从单纯比赛发展为协同育人平台，联合科研院所、高校、科创企业对获奖选手进行跟踪培育，并从第七届起建立青少年人工智能人才数据库，联合北京师范大学开发素养课程。本届比赛起融入人工智能治理和伦理内容，未来计划制定素养课程框架和评价量化指标。", "source": "新华网教育", "date": "2026-09-23"}, {"id": "t-76c485b4", "title": "教育部：幼升小、小升初，这样做好科学衔接！", "summary": "教育部发布“十问十答”指导幼升小、小升初科学衔接。幼儿园需做好身心、生活、社会和学习四方面准备，严禁教育内容、方式和环境“小学化”。小学应设置入学适应期，实施零起点教学，一年级不布置书面家庭作业、不进行纸笔考试。初中需放缓开学首月教学进度，指导学生掌握学习方法，并设置心理辅导室帮助学生做好入学心理调适。", "source": "新华网教育", "date": "2026-09-29"}, {"id": "t-c5a05a03", "title": "研究揭示调控雄性小鼠应激应对策略的神经机制", "summary": "中国科学院心理研究所科研团队揭示了海马CA1中间区GluN3A调控雄性小鼠应激应对策略的神经机制，发现GluN3A通过调控CA1i锥体神经元活动水平影响慢性应激下的应对策略，为应激相关精神障碍的干预靶点提供了新思路。", "source": "中国科学院", "date": "2026-09-29"}, {"id": "t-a039b569", "title": "全球首个端侧驱动本体的具身世界模型！大晓机器人发布Kairos 3.1", "summary": "大晓机器人在2026世界人工智能大会上发布全球首个端侧驱动本体的具身世界模型Kairos 3.1，同时发布环境式数据采集方案2.0及面向即时零售、酒店服务、开放场景的三大垂直解决方案（晓满、晓新、晓途），构建从数据采集、统一模型到端侧推理与本体控制的完整技术体系。", "source": "商汤科技", "date": "2026-09-28"}, {"id": "t-52da72b6", "title": "人工智能中小企业创业支持计划启动", "summary": "工业和信息化部宣布启动人工智能中小企业创业支持计划，计划用三年时间在行业应用、数据服务、智能算力等领域培育1万家以上科技和创新型中小企业，并建设多个孵化器、公共服务平台及产业集群。广东部分中小企业已利用AI工具进行数字化转型，智算中心客户和业务量大幅增长。", "source": "科技日报", "date": "2026-09-29"}, {"id": "t-a96f0f95", "title": "正听丨别有用心，美造谣中国打造机器人大军", "summary": "路透社报道宣称中国军方正为人形机器人参战做准备，但报道自身承认无证据表明解放军已部署武装人形机器人。与此同时，美国企业已将人形机器人送至乌克兰前线测试，并与美军签署研究合同。专家指出人形机器人目前并非实用的战场系统，真正值得警惕的是人工智能军事化竞赛的失控。", "source": "科技日报", "date": "2026-09-29"}, {"id": "t-2fb8ebfc", "title": "千余名中小学生同上“科学课” 黑龙江科普试点落地哈尔滨", "summary": "黑龙江省中小学生科普活动试点工作在哈尔滨市落地开展，确定20所中小学为首批示范校，截至9月中旬已完成8所学校专场科普活动，惠及千余名学生。该试点由黑龙江省科技厅与教育厅联动推进，将高端科研资源转化为校园科学课程，涵盖前沿科技、本土产业、生活实用三大维度。", "source": "中新网教育", "date": "2026-09-19"}, {"id": "t-340d3701", "title": "李志伟：AI时代要着重培养提问和表达能力", "summary": "北京景山学校教育集团总校长李志伟认为，随着人工智能深度融入日常学习场景，AI时代应着重培养学生会提问、善表达的能力。", "source": "新华网科技", "date": "2026-09-29"}, {"id": "t-4f477e85", "title": "城乡孩子跨屏上优课", "summary": "甘肃省全面构建“云、网、端”智慧教育生态，建成贯通省市县校的教育专网和省级智慧教育平台，实现与国家平台四通。通过推进智慧课堂、云端名校及东西部协作帮扶，推动教育从“经验教学”向“数据导航”转变，从“单向输血”向“双向造血”升级，缩小城乡教育差距，实现“在家门口上好学”的跨越式发展。", "source": "光明网教育", "date": "2026-09-29"}, {"id": "t-6f87296d", "title": "AI加速渗透、从卖产品到卖服务、出海成关键增量 冲刺万亿 北斗产业发展呈三大新动向", "summary": "中国北斗产业正加速与人工智能等前沿技术融合，规模化应用持续向纵深拓展，产业模式从“卖产品”向“卖服务”升级，并加快出海节奏以扩大全球影响力，冲刺万亿产业规模。", "source": "新华网科技", "date": "2026-09-23"}, {"id": "t-c7c1008c", "title": "香港中文大学发布新一份五年策略计划", "summary": "香港中文大学公布新一份五年策略计划《中大2026—2030:腾跃新程,励行志远》,围绕人才培育、知识创新、国际联系等领域,以\"TIGER\"行动框架统领五大策略范畴,聚焦生命健康科技、人工智能、量子科学等前沿科研,并对接国家\"十五五\"规划与香港首个五年规划。", "source": "中新网教育", "date": "2026-09-10"}, {"id": "t-8154b999", "title": "超本科线123分读高职：这些高分考生为何“逆向流动”？", "summary": "2026年高考招生中，部分高分考生选择跨过本科线报考高职专科，这种“逆向流动”是家庭基于成本、就业和发展前景作出的理性选择。国家职业教育体系的完善、定向项目的就业保障以及新兴产业对实操技术岗的需求，推动了高职热的形成。", "source": "中新网教育、光明网教育", "date": "2026-09-29"}, {"id": "t-3de86c3c", "title": "长六丙“一箭七星”发射成功", "summary": "2026年8月25日11时21分，长征六号丙遥一运载火箭在太原卫星发射中心发射升空，将中科卫星14星等7颗卫星顺利送入预定轨道。其中灵知09泰国立方星由银河航天研制，是中国商业航天卫星企业首次面向东南亚国家完成整星研制、发射及在轨交付。中科卫星14星、15星为SAR卫星，单颗重360公斤。", "source": "科技日报", "date": "2026-09-11"}, {"id": "t-573cea4d", "title": "研究揭示非计划冲动性与拖延之间的共享神经遗传基础", "summary": "中国科学院心理研究所等团队通过双生子追踪、脑影像和基因表达分析证实，拖延与非计划冲动性存在共享的神经遗传基础，但拖延也有其独特的遗传影响因素及环境作用。研究指出拖延并非仅因意志力薄弱，而是与长期规划、目标维持等神经生物学差异相关。", "source": "中国科学院", "date": "2026-09-29"}, {"id": "t-50044fc9", "title": "久久为功 实现科学教育“做中学”目标", "summary": "资料论述了科学教育“做中学”是一项系统性、长期性育人工程，需依托常态化、体系化的课程教学实施。文章提出学科实践、跨学科主题学习、综合实践活动是落实“做中学”的主阵地与路径，并指出AI应用为科学教育提供了新动能。", "source": "光明网教育", "date": "2026-09-19"}, {"id": "t-0b740069", "title": "北京师范大学—山西省乡宁县基础教育高质量发展行动计划座谈会举行", "summary": "9月18日，北京师范大学与山西省乡宁县举行基础教育高质量发展行动计划座谈会，双方围绕教师培养、学校建设等深化合作，推动县域教育高质量发展。该项目周期三年，旨在打造卓越校长和教师队伍，推动乡宁教育向数智驱动转型。", "source": "北京师范大学", "date": "2026-09-29"}, {"id": "t-cfc7cf2f", "title": "教育部党组召开会议 学习贯彻习近平总书记重要指示精神 总结树立和践行正确政绩观学习教育", "summary": "9月1日，教育部党组书记、部长怀进鹏主持召开党组会，传达学习习近平总书记重要指示精神，总结教育部直属系统树立和践行正确政绩观学习教育，并研究部署巩固拓展学习教育成果、建立长效机制工作。", "source": "教育部", "date": "2026-09-29"}, {"id": "t-71e32423", "title": "教育对口支援西藏工作会议暨教育系统援藏干部人才座谈会在拉萨召开", "summary": "8月13日,教育对口支援西藏工作会议暨教育系统援藏干部人才座谈会在拉萨召开。教育部部长怀进鹏、西藏自治区党委书记王君正、中央西藏工作协调小组办公室副主任郑堆等出席会议并讲话。会议总结了\"十四五\"期间教育援藏工作成效,部署了\"十五五\"时期教育援藏工作,强调要聚焦精准援藏、系统援藏、长期援藏,推进基础教育扩优提质、职业教育创新转型、高等教育内涵式发展。", "source": "教育部", "date": "2026-09-28"}, {"id": "t-c8752a7c", "title": "可编辑，改图太方便！SenseNova U1信息图增强版V3发布", "summary": "商汤科技发布SenseNova U1信息图增强版V3（SenseNova-U1-8B-MoT-Infographic-V3），在V2信息图生成能力基础上首次加入信息图编辑能力，支持局部文字编辑、局部内容编辑、全局风格编辑和全局布局编辑。模型从MT阶段重启训练以兼顾生成与编辑能力，在WeEdit评测基准上取得开源模型最优表现，已面向全球用户开源。", "source": "商汤科技", "date": "2026-09-29"}, {"id": "t-07a75d76", "title": "某旅游平台上架太空游产品，花510万元“上天”能飞到哪里？", "summary": "某旅游平台上架了一款售价510万元起的6天太空旅行产品，旅客将搭乘维珍银河的空射宇宙飞船体验90分钟的亚轨道太空飞行。亚轨道飞行在100公里左右的卡门线附近进行，技术难度和成本较低。该飞行对身体条件要求相对宽松，健康人群经短期学习适应即可参与。实现太空游大众化的关键在于可重复使用技术，目前维珍银河和蓝色起源均走此路线。", "source": "科技日报", "date": "2026-09-29"}, {"id": "t-b02eb1e9", "title": "“做党和人民满意的好老师”——习近平总书记的重要论述指引教师工作开创新局面", "summary": "文章总结了党的十八大以来习近平总书记关于教师队伍建设的重要论述及指引下的工作成效。论述涵盖“四有”好老师、教育家精神等理念，并介绍了国家在师德师风建设、教师发展体系及待遇保障等方面的政策举措，指出截至2025年我国专任教师超1870万人，支撑起世界最大规模教育体系。", "source": "中国政府网要闻、光明网教育", "date": "2026-09-29"}, {"id": "t-f74171be", "title": "国务院办公厅关于进一步加强烟花爆竹全链条安全监管的意见", "summary": "国务院办公厅发布关于进一步加强烟花爆竹全链条安全监管的意见，涵盖生产、储存、经营、运输、燃放等各环节，提出严格准入许可、强化药物管控、严控过程风险、打击非法违法行为等要求，并废止2010年53号文件，自印发之日起施行。", "source": "中国政府网政策", "date": "2026-09-19"}, {"id": "t-f7610159", "title": "王永炎院士逝世", "summary": "中国工程院院士、中国中医科学院名誉院长王永炎因病于2026年8月30日在北京逝世，享年87岁。他是中医脑学科奠基人，在中医药临床、标准化及教育领域贡献卓著。", "source": "科技日报", "date": "2026-09-29"}, {"id": "t-f8ff8522", "title": "怀进鹏会见芬兰教育科学文化部长塔尔维蒂耶", "summary": "9月17日，中国教育部部长怀进鹏会见芬兰教育科学文化部部长塔尔维蒂耶，双方共同主持中芬教育部长磋商机制首次会议，探讨加强教育发展战略对接及多领域科研合作，并签署会议纪要。", "source": "教育部", "date": "2026-09-29"}, {"id": "t-6e870035", "title": "不与AI赛跑 业界冀职业教育转向培育人类独有核心素养", "summary": "2026职业教育海上对话创享会于9月12日至13日在上海举行，聚焦智能时代职业教育改革。与会专家认为职教核心应转向培育AI无法替代的人类核心素养，并发布《2025上海职业教育事业蓝皮书》。", "source": "中新网教育", "date": "2026-09-14"}, {"id": "t-e4b0ec68", "title": "新华视点｜多地科创突围 “中国智造”聚力跃升", "summary": "报道聚焦多地科创与产业升级：浙江高档数控机床技术创新中心构建全链条产业服务生态并获省级科技进步一等奖；宁波永新光学承制中国首台太空显微实验仪入驻空间站并主导国际标准制定；苏州激光产业链上下游协同发展；山东日照岚山区以产业集群培育专精特新企业；合肥具身智能机器人训练场通过数据采集提升机器人AI能力。", "source": "新华网科技", "date": "2026-09-25"}, {"id": "t-24ef8767", "title": "习近平在埃及媒体发表署名文章", "summary": "习近平在赴埃及进行国事访问之际，在埃及媒体发表署名文章，回顾中埃建交70年来的友好合作历程，并提出深化全面战略伙伴关系、推进中埃命运共同体建设的五点建议。", "source": "中国政府网要闻", "date": "2026-09-25"}, {"id": "t-a5747d6a", "title": "国有资产管理处组织教职工赴昌平区人才保租房项目实地看房", "summary": "国有资产管理处于8月28日组织教职工赴昌平区泊寓·院儿生命科学园社区保租房项目实地看房，以服务教师住房需求并助力解决教职工安居问题。", "source": "北京师范大学", "date": "2026-09-29"}, {"id": "t-36cd88c9", "title": "得过也可能再得，对酒精不敏感——假期临近，这些传染病需警惕", "summary": "中秋国庆假期临近，中国疾控中心研究员彭质斌提醒公众需警惕登革热、疟疾等蚊媒传染病及手足口病、诺如病毒胃肠炎等传染病。防蚊灭蚊、注意饮食卫生、及时接种疫苗及有症状就医是主要防护措施。", "source": "科技日报", "date": "2026-09-29"}, {"id": "t-09ad6fb4", "title": "科研人员发现大脑全新神经调控环路", "summary": "中国科学院脑科学与智能技术卓越创新中心研究发现，大脑伏隔核内D1和D2神经元可通过调控基底前脑至基底外侧杏仁核的胆碱能输入，双向控制杏仁核乙酰胆碱释放，从而标记外界重要事件并影响注意力、情绪和学习决策。该成果发表于《自然-神经科学》。", "source": "中国科学院", "date": "2026-09-22"}, {"id": "t-6d780888", "title": "总编辑圈点丨发现了暗物质？学界反应不一，最大暗物质探测器捕获神秘信号", "summary": "全球最大的暗物质探测器LZ在分析220天运行数据时发现一例约248千电子伏的氙原子核反冲异常事件，无法用已知背景解释。团队明确否认已发现暗物质，仅承认找到一个值得检验的异常事件。学界对此反应不一，需更多数据验证。", "source": "科技日报", "date": "2026-09-08"}, {"id": "t-3e15ee7c", "title": "自然资源部组织开展我国台湾岛以东管辖海域海洋地球物理综合调查", "summary": "自然资源部第二海洋研究所于8月10日至31日在我国台湾岛以东海域开展海洋地球物理综合调查,利用多波束、多道地震等技术采集海底环境基础数据,为管辖海域综合治理提供科学依据。", "source": "科技日报", "date": "2026-09-29"}, {"id": "t-9507b467", "title": "教育数字化政策发布", "summary": "国务院有关部门发布了教育数字化政策，强调以安全、可靠、普惠的技术能力服务学校、教师、学生和家庭，要求完善数字教育资源供给，加强人工智能应用规范和数据治理，持续提升教育公共服务质量。", "source": "中国政府网政策", "date": "2026-09-17"}, {"id": "t-25ddc964", "title": "刘国中在内蒙古调研时强调 切实抓好农业防灾减灾 全力夺取秋粮丰产丰收", "summary": "刘国中在内蒙古调研时强调抓好农业防灾减灾和秋粮生产，提出加快人工智能运用和智慧农业发展，并推进高标准农田建设、种业振兴、农业节水及土地承包延长试点等工作。", "source": "中国政府网要闻", "date": "2026-09-06"}, {"id": "t-7144a1e2", "title": "雅思官方模考系统中国上线 人工智能赋能诊断式测评", "summary": "雅思官方模考系统近日在中国上线，由英国文化教育协会中国团队主导研发，包含全科、口语和写作模考，以诊断式测评为入口，帮助考生认识自身能力并提升，同时为教师和机构提供学情数据支持。", "source": "中新网教育", "date": "2026-09-29"}, {"id": "t-1934dff3", "title": "新一代通信网重塑生产生活", "summary": "新一代通信网集地面蜂窝网络、万兆光网、卫星互联网等于一体，实现空天地海全域覆盖。全国136个万兆光网试点项目已落地，5G基站向5G-A升级，6G与卫星互联网提速。万兆光网在工厂、园区、社区等场景大幅提升生产效率与民生体验，低空经济、智能网联汽车等新兴赛道也因网络升级获得发展空间。", "source": "科技日报", "date": "2026-09-24"}, {"id": "t-fc951431", "title": "国家教育行政学院举行2026年秋季开学典礼", "summary": "8月31日，国家教育行政学院举行2026年秋季开学典礼，教育部党组书记、部长、国家教育行政学院院长怀进鹏出席并作报告，强调要全力实施教育发展“十五五”规划，全面推进教育强国建设，并要求广大学员提升履职能力，为教育强国建设多立新功。", "source": "教育部", "date": "2026-09-16"}, {"id": "t-7d33d167", "title": "宁夏首次线上发放毕业生一次性求职补贴", "summary": "宁夏人社厅等六部门联合印发通知，明确今年一次性求职补贴申领范围，并首次推行线上发放模式，通过数据比对精准筛选符合条件的困难高校毕业生，以减轻基层负担并提升发放效率。", "source": "光明网教育", "date": "2026-09-29"}, {"id": "t-be18679e", "title": "今年秋季学期中小学科学教育“上新” “做中学”，让科学教育落地生根", "summary": "教育部印发《义务教育阶段科学教育“做中学”领航行动指南》，要求今年9月秋季开学起全国中小学开展科学教育“做中学”领航行动。该指南聚焦加强科学探究实践，推动育人方式变革，规定4-9年级学生每学期完成不少于1个任务且不少于4课时，并明确不新增纸笔考试，将探究过程表现纳入综合素质评价档案。", "source": "新华网教育", "date": "2026-09-29"}, {"id": "t-6bc075c0", "title": "“兴边育才·数智赋能”边境县教育高质量发展研讨会举办——北京师范大学“强师工程·C100教育强区赋能计划”正式启动", "summary": "8月24日至25日，“兴边育才·数智赋能”边境县教育高质量发展研讨会在黑龙江鸡西举行，会上正式启动了北京师范大学“强师工程·C100教育强区赋能计划”。会议包含开幕式、捐赠仪式、主旨报告、主题研讨、送教行及闭幕式等环节，汇聚多方力量共话边境教育高质量发展。", "source": "北京师范大学", "date": "2026-09-14"}, {"id": "t-5f6930e9", "title": "新学期，新变化——各地多措并举护航学生成长", "summary": "9月1日全国各地中小学迎来秋季新学期。各地多措并举保障学生顺利就学，包括灾区学校修复与分流办学、多地新增学位与教育托管以促进优质教育。同时，多地推进“阳光分班”与减负政策，关注学生身心健康。新学期全国中小学完成新教材替换，强调“做中学”与科学探究实践，推动教学方式从“听中学”向“做中学”变革。", "source": "科技日报", "date": "2026-09-29"}, {"id": "t-2e14c810", "title": "睦邻友好开新局 繁荣共兴启新篇——吉尔吉斯斯坦各界人士高度评价习近平主席国事访问", "summary": "习近平主席对吉尔吉斯斯坦进行国事访问，两国元首签署永久睦邻友好合作条约及联合宣言，推动中吉命运共同体建设。双方商定在共建“一带一路”、数字经济、绿色矿产、人工智能等领域深化合作，并加强教育、口岸及基础设施互联互通建设。", "source": "中国政府网要闻", "date": "2026-09-18"}, {"id": "t-8e2a5cdb", "title": "应聘“旅游顾问”被要求提供不当服务 BOSS直聘发布求职安全提示", "summary": "BOSS直聘安全团队在日常巡查中发现，个别招聘者借“旅游顾问”“导游”等正常职位名义，在后续沟通中提出“多尺度陪玩”“一对一陪伴”等不当服务要求，或过度关注求职者外貌并索要生活照。相关违规账号已被封禁，平台提醒求职者提高警惕并持续加强AI风控识别与处置。", "source": "光明网教育", "date": "2026-09-29"}, {"id": "t-b9d3feba", "title": "AI时代 家校协同如何赋能大学生成长", "summary": "在人工智能时代背景下，家校协同育人正从基础教育向高等教育延伸。面对大学新生适应问题及AI技术带来的挑战，高校通过启动“家长学堂”等载体，与家庭凝聚育人合力。同时，教育部等部门出台政策，强调科技与人文教育结合，倡导家校共同制定AI使用底线，着力培育青年学生的自驱力与人文精神。", "source": "中新网教育", "date": "2026-09-01"}, {"id": "t-20346cb6", "title": "“拆解”具身智能机器人 读懂未来产业“新赛道”", "summary": "9月24日，天津大学具身智能研究院正式成立，现场启动了20亿元的创新产业基金，一批校企联合实验室揭牌，具身智能产教创新联合体同步签约落地。研发实用的具身智能机器人需要跨学科协作、产学研联动。", "source": "新华网科技", "date": "2026-09-26"}, {"id": "t-6fe05796", "title": "【活力中国调研行】00后“数采员”：给具身智能机器人当“老师”", "summary": "中国青年报记者于7月30日在浙江嘉兴的浙江清华柔性电子技术研究院具身智能实训场采访，报道了\"数据采集员\"这一新兴职业。数采员多为00后，通过VR眼镜和机械爪在模拟生活场景中为具身智能机器人做示范动作以采集训练数据。00后杨慧琴半年内从组员成长为项目计划员，该院目前有近300名数采员，并与外地学校合作提供实习机会。", "source": "中新网教育", "date": "2026-09-29"}, {"id": "t-f40cdc80", "title": "商汤Token Plan再进化！让国产算力跑通“工业级”大模型", "summary": "商汤科技SenseNova Token Plan于2026年5月上线后一个月内Token使用量增长7倍,随后正式接入新型国产化算力并完成适配调优,将其纳入大模型推理资源池。通过模型、平台、算力三层一体化协同,实现用户无感知的跨硬件服务体验,推动国产算力进入工业级大模型服务链条。", "source": "商汤科技", "date": "2026-09-10"}, {"id": "t-12ef0217", "title": "2026教师节特别节目即将播出", "summary": "教育部教师工作司联合中央广播电视总台社教节目中心打造了2026教师节特别节目《筑梦为光——讲述我的育人故事》，共6集，于9月3日至8日在CCTV-10频道播出，展现了全国优秀教师代表的育人故事。", "source": "光明网教育", "date": "2026-09-03"}, {"id": "t-dd9a18a0", "title": "前7月机械工业生产实现较快增长", "summary": "前7月机械工业主要涉及的5个大类行业增加值同比保持增长趋势，其中通用设备制造业增长7.9%，专用设备制造业增长8.8%，汽车制造业增长7.2%，电气机械和器材制造业增长6.5%，仪器仪表制造业增长9.4%。代表性产品中，工业机器人累计产量63.5万套同比增长28.5%，发电机组累计产量20897万千瓦同比增长2.8%。", "source": "中国政府网要闻", "date": "2026-09-06"}], "pairs": [{"id": "p-19823564", "left": "一周科技盘点丨刷新纪录、填补空白！中国科技创新捷报频传", "right": "一周科技盘点丨全球首艘、世界最长、首飞成功……上周，我国多领域硬核成果密集涌现"}, {"id": "p-7788377a", "left": "新型抗血栓肽研究取得进展", "right": "mRNA递送方向研究取得进展"}, {"id": "p-12e5562d", "left": "北师大召开2026年秋季学期就业工作推进会", "right": "2026年“百万英才兴海南·四城同办”校招系列活动启动"}, {"id": "p-add7fd96", "left": "mRNA递送方向研究取得进展", "right": "仿生骨组织工程研究取得进展"}, {"id": "p-c22a5e2d", "left": "总编辑圈点 | 63℃仍能分裂繁殖，火变形虫改写真核生物耐热上限", "right": "总编辑圈点丨基因开关让3D打印骨组织自主长出新血管 为治疗创伤或感染导致的骨缺损带来希望"}, {"id": "p-8e3aec7a", "left": "国际爱护动物基金会一行访问北京师范大学", "right": "泰国教育部民校教育委员会一行访问北京师范大学"}, {"id": "p-846b43c5", "left": "推动上海合作组织发展的中国行动成果清单", "right": "习近平出席上海合作组织成员国元首理事会第二十六次会议并发表重要讲话"}, {"id": "p-1748e198", "left": "携手同心 不断推进中埃命运共同体建设——埃及各界人士高度评价习近平主席国事访问", "right": "展现历史担当 汇聚和平发展力量——写在习近平主席出席2026年上海合作组织峰会并对吉尔吉斯斯坦、埃及进行国事访问之际"}, {"id": "p-e76a8876", "left": "丁薛祥出席2026年全球服务贸易峰会并会见与会外国政要", "right": "数学AI首次与高中生同台竞技 2026年中国东南地区数学交流活动在榕闭幕"}, {"id": "p-d07aa876", "left": "海洋光学卫星定标研究取得进展", "right": "mRNA递送方向研究取得进展"}, {"id": "p-058ad0b6", "left": "【教育部简报】北京师范大学推进高水平师范院校建设 助力基础教育高质量发展", "right": "北京师范大学召开树立和践行正确政绩观学习教育总结会"}, {"id": "p-22cb47d0", "left": "海洋光学卫星定标研究取得进展", "right": "低计数PET成像研究取得进展"}, {"id": "p-03c40624", "left": "大面积铜锌锡硫硒薄膜光伏组件研究获进展", "right": "二维层状晶体塑性调控研究获进展"}, {"id": "p-6f82a3f6", "left": "大气活性氯来源研究取得进展", "right": "低计数PET成像研究取得进展"}, {"id": "p-8db7219b", "left": "怀进鹏向中国—吉尔吉斯斯坦卓越工程师学院揭牌仪式发表视频致辞", "right": "习近平同吉尔吉斯斯坦总统扎帕罗夫会谈"}, {"id": "p-e06080c1", "left": "用技能为青春加冕——第48届世界技能大赛中国代表团创历史最好成绩", "right": "在世界技能大会体验外骨骼机器人"}, {"id": "p-3c0cafc5", "left": "推动金砖合作实现大发展、展现大作为——写在习近平主席出席金砖国家领导人第十八次会晤之际", "right": "金砖国家领导人第十八次会晤新德里宣言（摘要）"}, {"id": "p-538c956e", "left": "偏振视觉研究取得进展", "righ   const body = state.set === "news"
    ? `<div class="q">这条新闻适合发到给家长看的朋友圈吗？（科学、科技、教育相关，正面，家长会关心）</div>
       <p class="title">${esc(item.title)}</p><div class="meta">${esc(item.source)} · ${esc(item.date)}</div>
       <div class="sum">${esc(item.summary)}</div>`
    : `<div class="q">这两条标题说的是不是同一件事？（同一事件、同一政策或同一项成果，算同一件事）</div>
       <div class="pair"><div>${esc(item.left)}</div><div>${esc(item.right)}</div></div>`;
  const btns = OPTS[state.set].map(([v, t]) =>
    `<button class="${v}${picked === v ? " picked" : ""}" data-v="${v}">${t}</button>`).join("");
  document.getElementById("card").innerHTML = body + `<div class="btns">${btns}</div>`;
  document.querySelectorAll(".btns button").forEach(b => b.onclick = () => pick(b.dataset.v));
}
function pick(v) {
  const items = DATA[state.set], item = items[state.idx[state.set]];
  state.labels[item.id] = {label: v, at: new Date().toISOString()};
  if (state.idx[state.set] < items.length - 1) state.idx[state.set]++;
  save(); render();
}
function move(d) {
  const n = DATA[state.set].length;
  state.idx[state.set] = Math.max(0, Math.min(n - 1, state.idx[state.set] + d)); save(); render();
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { state.set = t.dataset.set; save(); render(); });
document.getElementById("prev").onclick = () => move(-1);
document.getElementById("next").onclick = () => move(1);
document.addEventListener("keydown", e => {
  if (e.key === "1") pick("y"); else if (e.key === "2") pick("n"); else if (e.key === "3") pick("s");
  else if (e.key === "ArrowLeft") move(-1); else if (e.key === "ArrowRight") move(1);
});
document.getElementById("export").onclick = () => {
  const out = {exported_at: new Date().toISOString(), labeller: state.name || "owner", labels: state.labels};
  const blob = new Blob([JSON.stringify(out, null, 1)], {type: "application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "评测标注结果-0930.json"; a.click();
};
document.getElementById("who").innerHTML = online ? `标注人：<b>${esc(state.name || "")}</b> <a href="#" id="rename">改名</a>` : "";
const rn = document.getElementById("rename"); if (rn) rn.onclick = e => { e.preventDefault(); askName(); location.reload(); };
render(); sync();
</script></body></html>
